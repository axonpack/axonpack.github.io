<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Axonpack has moved to axonpack.dev</title>
    <meta name="robots" content="noindex" />
    <!-- Pages can't send a real redirect, and serves 404.html (this same file) for every unknown
         path, so one script covers every old link. The meta refresh is for no-JS and loses the path. -->
    <script>
      location.replace("https://axonpack.dev" + location.pathname + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://axonpack.dev/" />
  </head>
  <body>
    <p>Axonpack has moved to <a href="https://axonpack.dev/">axonpack.dev</a>.</p>
  </body>
</html>
