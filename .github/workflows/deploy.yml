name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A pull request builds to prove it still compiles, and stops before publishing.
  pull_request:
  # Versions, download counts and changelogs come from npm at build time, so they go stale on
  # their own with no commit to trigger a rebuild.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deploy is only stale, so cancelling one costs nothing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Must run before the typecheck. src/generated/packages.json is gitignored because it is
      # rebuilt from npm every time, so in a fresh clone it does not exist yet and
      # packages.service.ts cannot resolve its import. Locally this passes only because a build
      # has already happened.
      - name: Fetch the catalogue from npm
        run: bun run packages

      # astro check needs @astrojs/check, which is a devDependency for exactly this reason.
      # Without it the command tries to install interactively and hangs the job.
      - name: Typecheck
        run: bun run typecheck

      # Runs scripts/fetch-packages.mjs first, so the catalogue, versions, download counts and
      # changelogs are read from npm on every deploy. No credentials: every source is public.
      - name: Build
        run: bun run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    # Only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
