name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Versions, download counts and changelogs go stale on their own, with no commit to rebuild.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # `bun run build` runs scripts/fetch-packages.mjs first, so the catalogue is discovered from
      # npm on every deploy. No credentials: every source is a public npm endpoint.
      - name: Build static site
        run: bun run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    # A pull request builds to prove it still compiles, and stops there — only main is published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
